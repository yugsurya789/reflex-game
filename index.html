<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Number Game with QR Deposit</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }
        .wallet-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .wallet {
            font-size: 1.1rem;
            color: #f1c40f;
            font-weight: bold;
        }
        .deposit-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .deposit-btn:hover { background-color: #2980b9; }
        
        input {
            padding: 10px;
            font-size: 1rem;
            width: 85%;
            border-radius: 8px;
            border: none;
            margin-bottom: 12px;
            text-align: center;
        }
        .play-btn {
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 90%;
        }
        .play-btn:hover { background-color: #27ae60; }
        #result { margin-top: 15px; font-weight: bold; min-height: 24px; }

        /* QR Modal Styling */
        #qrModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #2c3e50;
            padding: 20px;
            border-radius: 12px;
            max-width: 280px;
            width: 90%;
            text-align: center;
        }
        .qr-placeholder {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            color: black;
            font-weight: bold;
        }
        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎲 Fun Lucky Game</h2>
        
        <!-- Wallet & Deposit Section -->
        <div class="wallet-box">
            <div class="wallet">Coins: <span id="balance">1000</span> 🪙</div>
            <button class="deposit-btn" onclick="openQrModal()">+ Deposit</button>
        </div>
        
        <input type="number" id="betAmount" placeholder="Kitne coins lagane hain?" min="10">
        <input type="number" id="userNumber" placeholder="1 se 10 ke beech number chuno" min="1" max="10">
        
        <button class="play-btn" onclick="playGame()">Spin & Check (2x Win)</button>
        <p id="result"></p>
    </div>

    <!-- QR Deposit Modal -->
    <div id="qrModal">
        <div class="modal-content">
            <h3>📱 Scan & Deposit</h3>
            <p style="font-size: 0.9ndrem; opacity: 0.8;">Fun balance add karne ke liye scan karein (Demo)</p>
            
            <div class="qr-placeholder">
                [ ⬛ ⬜ ⬛ QR CODE ⬜ ⬛ ⬜ ]<br>
                <span style="font-size: 0.8rem; color: #666;">UPI: funwallet@paytm</span>
            </div>

            <button class="play-btn" style="background-color: #f39c12; width: 100%; margin-bottom: 8px;" onclick="simulatePayment()">Payment Ho Gayi (+500 Coins)</button>
            <br>
            <button class="close-btn" onclick="closeQrModal()">Band Karein</button>
        </div>
    </div>

    <script>
        let balance = 1000;

        function playGame() {
            const bet = parseInt(document.getElementById('betAmount').value);
            const chosenNumber = parseInt(document.getElementById('userNumber').value);
            const resultEl = document.getElementById('result');
            const balanceEl = document.getElementById('balance');

            if (!bet || bet <= 0 || bet > balance) {
                resultEl.innerText = "⚠️ Sahi coin amount daalein!";
                resultEl.style.color = "#f1c40f";
                return;
            }
            if (!chosenNumber || chosenNumber < 1 || chosenNumber > 10) {
                resultEl.innerText = "⚠️ 1 se 10 ke beech ka number chunein!";
                resultEl.style.color = "#f1c40f";
                return;
            }

            balance -= bet;
            const luckyNumber = Math.floor(Math.random() * 10) + 1;

            if (chosenNumber === luckyNumber) {
                const winAmount = bet * 2;
                balance += winAmount;
                resultEl.innerText = `🎉 Lucky Number ${luckyNumber} tha! Aap ${winAmount} coins jeet gaye!`;
                resultEl.style.color = "#2ecc71";
            } else {
                resultEl.innerText = `❌ Lucky Number ${luckyNumber} tha. Dobara try karein!`;
                resultEl.style.color = "#e74c3c";
            }

            balanceEl.innerText = balance;
        }

        // QR Modal Functions
        function openQrModal() {
            document.getElementById('qrModal').style.display = 'flex';
        }

        function closeQrModal() {
            document.getElementById('qrModal').style.display = 'none';
        }

        function simulatePayment() {
            balance += 500;
            document.getElementById('balance').innerText = balance;
            alert("✅ Deposit successful! 500 fun coins added.");
            closeQrModal();
        }
    </script>
</body>
</html>
