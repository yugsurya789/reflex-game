<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ram vs Ravan - Arcade Hub</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #0f2027);
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }
        /* Wallet Bar */
        .wallet-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .wallet { font-size: 1.1rem; color: #f1c40f; font-weight: bold; }
        .deposit-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #e67e22;
            color: white;
        }

        .game-section { display: none; }
        .game-section.active { display: block; }

        /* Common Elements */
        input {
            padding: 10px;
            font-size: 1rem;
            width: 90%;
            border-radius: 8px;
            border: none;
            margin-bottom: 12px;
            text-align: center;
        }
        .action-btn {
            padding: 12px;
            font-size: 1rem;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 90%;
        }
        .action-btn:hover { background-color: #d35400; }
        #result { margin-top: 12px; font-weight: bold; min-height: 24px; }

        /* Archery Canvas */
        canvas {
            background: linear-gradient(to bottom, #111927, #1f314f);
            border-radius: 10px;
            border: 2px solid #e67e22;
            width: 100%;
            height: 210px;
            display: block;
            margin-bottom: 10px;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 8px;
            color: #f39c12;
            font-weight: bold;
        }

        /* QR Modal */
        #qrModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #2c3e50;
            padding: 20px;
            border-radius: 12px;
            max-width: 280px;
            width: 90%;
        }
        .qr-placeholder {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            color: black;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Wallet Bar -->
        <div class="wallet-box">
            <div class="wallet">Coins: <span id="balance">1000</span> 🪙</div>
            <button class="deposit-btn" onclick="openQrModal()">+ Deposit</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" id="tab-archery" onclick="switchTab('archery')">🏹 Ram vs Ravan</button>
            <button class="tab-btn" id="tab-lucky" onclick="switchTab('lucky')">🎲 Lucky Number</button>
        </div>

        <!-- GAME 1: RAM VS RAVAN ARCHERY -->
        <div id="game-archery" class="game-section active">
            <div class="score-board">
                <span>Hits: <b id="hitScore">0</b></span>
                <span>Arrows Left: <b id="arrowsLeft">10</b></span>
            </div>
            <canvas id="archeryCanvas" width="320" height="210"></canvas>
            <p style="font-size: 0.8rem; opacity: 0.8; margin: 4px 0;">Screen par <b>TAP</b> karke Ravan ke putle par Teer chalayein!</p>
            <button class="action-btn" id="startArcheryBtn" onclick="startArcheryGame()">Yuddh Shuru Karein</button>
        </div>

        <!-- GAME 2: LUCKY NUMBER -->
        <div id="game-lucky" class="game-section">
            <p style="font-size: 0.9rem; opacity: 0.9;">1 se 10 ke beech number chuno (2x Coins Jeeto)</p>
            <input type="number" id="betAmount" placeholder="Kitne coins lagane hain?" min="10">
            <input type="number" id="userNumber" placeholder="Number (1 - 10)" min="1" max="10">
            <button class="action-btn" onclick="playLucky()">Spin & Check</button>
            <p id="result"></p>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qrModal">
        <div class="modal-content">
            <h3>📱 Scan & Deposit</h3>
            <p style="font-size: 0.85rem; opacity: 0.8;">Fun coins add karne ke liye scan karein</p>
            <div class="qr-placeholder">
                [ ⬛ ⬜ ⬛ QR CODE ⬜ ⬛ ⬜ ]<br>
                <span style="font-size: 0.8rem; color: #555;">UPI: ramgame@upi</span>
            </div>
            <button class="action-btn" style="background: #f39c12; width: 100%; margin-bottom: 8px;" onclick="simulatePayment()">Payment Done (+500 Coins)</button>
            <button class="action-btn" style="background: #e74c3c; width: 100%;" onclick="closeQrModal()">Close</button>
        </div>
    </div>

    <script>
        let balance = 1000;
        function updateWallet(amount) {
            balance += amount;
            document.getElementById('balance').innerText = balance;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('game-' + tab).classList.add('active');
        }

        // --- RAM VS RAVAN ARCHERY GAME ---
        const canvas = document.getElementById('archeryCanvas');
        const ctx = canvas.getContext('2d');
        let gameActive = false;
        let hits = 0;
        let arrows = 10;
        
        let target = { x: 260, y: 80, radius: 22, speed: 2.5, direction: 1 };
        let arrow = { x: 40, y: 120, flying: false, speed: 12 };

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); shootArrow(); });
        canvas.addEventListener('mousedown', shootArrow);

        function startArcheryGame() {
            hits = 0;
            arrows = 10;
            document.getElementById('hitScore').innerText = hits;
            document.getElementById('arrowsLeft').innerText = arrows;
            document.getElementById('startArcheryBtn').style.display = 'none';
            gameActive = true;
            arrow.flying = false;
            arrow.x = 40;
            arrow.y = 120;
            archeryLoop();
        }

        function shootArrow() {
            if (!gameActive || arrow.flying || arrows <= 0) return;
            arrow.flying = true;
            arrows--;
            document.getElementById('arrowsLeft').innerText = arrows;
        }

        function archeryLoop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Ram (Archier Position)
            ctx.fillStyle = '#3498db';
            ctx.fillRect(25, 100, 20, 35); // Body
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath(); ctx.arc(35, 90, 8, 0, Math.PI * 2); ctx.fill(); // Head (Crown feel)

            // Move & Draw Ravan Target (Moving up and down)
            target.y += target.speed * target.direction;
            if (target.y < 35 || target.y > 175) target.direction *= -1;

            ctx.fillStyle = '#e74c3c'; // Ravan Red Head
            ctx.beginPath(); ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('RAVAN', target.x, target.y - 28);

            // Arrow Physics
            if (arrow.flying) {
                arrow.x += arrow.speed;
                // Draw Arrow
                ctx.strokeStyle = '#f1c40f';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(arrow.x - 15, arrow.y);
                ctx.lineTo(arrow.x, arrow.y);
                ctx.stroke();

                // Check Collision with Ravan Target
                let dist = Math.hypot(arrow.x - target.x, arrow.y - target.y);
                if (dist < target.radius + 10) {
                    hits++;
                    document.getElementById('hitScore').innerText = hits;
                    arrow.flying = false;
                    arrow.x = 40;
                } else if (arrow.x > canvas.width) {
                    // Missed
                    arrow.flying = false;
                    arrow.x = 40;
                }
            } else {
                // Ready Arrow on Bow
                ctx.strokeStyle = '#f1c40f';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(35, 105);
                ctx.lineTo(45, 105);
                ctx.stroke();
            }

            // Check Game Over
            if (arrows <= 0 && !arrow.flying) {
                gameActive = false;
                let reward = hits * 20;
                updateWallet(reward);

                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#2ecc71';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('YUDDH SAMAPT!', canvas.width / 2, 85);
                ctx.fillStyle = '#fff';
                ctx.font = '14px Arial';
                ctx.fillText(`Total Hits: ${hits} | Reward: +${reward} Coins 🪙`, canvas.width / 2, 115);

                const btn = document.getElementById('startArcheryBtn');
                btn.innerText = 'Dobara Yuddh Karein';
                btn.style.display = 'inline-block';
                return;
            }

            requestAnimationFrame(archeryLoop);
        }

        // --- LUCKY NUMBER GAME LOGIC ---
        function playLucky() {
            const bet = parseInt(document.getElementById('betAmount').value);
            const chosenNumber = parseInt(document.getElementById('userNumber').value);
            const resultEl = document.getElementById('result');

            if (!bet || bet <= 0 || bet > balance) {
                resultEl.innerText = "⚠️ Sahi coin amount daalein!";
                resultEl.style.color = "#f1c40f";
                return;
            }
            if (!chosenNumber || chosenNumber < 1 || chosenNumber > 10) {
                resultEl.innerText = "⚠️ 1 se 10 ke beech number chunein!";
                resultEl.style.color = "#f1c40f";
                return;
            }

            updateWallet(-bet);
            const luckyNumber = Math.floor(Math.random() * 10) + 1;

            if (chosenNumber === luckyNumber) {
                const winAmount = bet * 2;
                updateWallet(winAmount);
                resultEl.innerText = `🎉 Vijay! Lucky Number ${luckyNumber} tha, +${winAmount} coins jeete!`;
                resultEl.style.color = "#2ecc71";
            } else {
                resultEl.innerText = `❌ Lakshya chuk gaya! Lucky Number ${luckyNumber} tha.`;
                resultEl.style.color = "#e74c3c";
            }
        }

        // --- QR MODAL ---
        function openQrModal() { document.getElementById('qrModal').style.display = 'flex'; }
        function closeQrModal() { document.getElementById('qrModal').style.display = 'none'; }
        function simulatePayment() {
            updateWallet(500);
            alert("✅ 500 fun coins added!");
            closeQrModal();
        }
    </script>
</body>
</html>
